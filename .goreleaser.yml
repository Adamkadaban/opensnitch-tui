version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Linux builds with YARA support (CGO enabled)
  - id: linux-amd64
    main: ./cmd/opensnitch-tui
    binary: opensnitch-tui
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: linux-arm64
    main: ./cmd/opensnitch-tui
    binary: opensnitch-tui
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w

  # Windows builds without YARA (CGO disabled)
  - id: windows
    main: ./cmd/opensnitch-tui
    binary: opensnitch-tui
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    tags:
      - no_yara

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Adamkadaban
    name: opensnitch-tui
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
